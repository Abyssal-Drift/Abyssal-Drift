- type: entity
  parent: BaseStructureWall
  id: WallBunker
  name: bunker wall
  components:
  - type: Sprite
    sprite: _MS13/Tileset/Walls/bunker.rsi
  - type: Icon
    sprite: _MS13/Tileset/Walls/bunker.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Occluder # Breaks on diagonal walls
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: bunker
