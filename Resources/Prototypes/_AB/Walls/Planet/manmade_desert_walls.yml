- type: entity
  id: WallSandStone
  parent: BaseStructureWall
  name: sandstone wall
  description: A wall made of sandstone. It looks like it were made, rather than naturally occuring.
  components:
  - type: Sprite
    sprite: _MS13/Tileset/Walls/sandstone.rsi
  - type: Icon
    sprite: _MS13/Tileset/Walls/sandstone.rsi
  - type: Occluder # Breaks on diagonal walls
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  - type: IconSmooth
    key: walls
    base: sandstonewall
  - type: RandomIconSmooth
    randomStates:
      - sandstonewall
      - sandstonewallb
      - sandstonewallc
      - sandstonewalld
  - type: Appearance
